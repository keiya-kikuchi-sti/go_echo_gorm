services:
  app:
    image: golang:1.24.4-bookworm
    tty: true
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - .:/go/src/
    working_dir: /go/src
  db:
    image: mysql:9.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - db_vol:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
  postgres:
    image: postgres:latest
    restart: always
    ports: 
      - "5432:5432"
      # - "20443:20443"
    volumes:
      - ./.devcontainer/pg/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "pass"
      POSTGRES_DB: "db"

volumes:
  db_vol:
